[workspace]
resolver = "3"
members = ["crates/fakeman-core", "crates/fakeman-store", "crates/fakeman-app"]
default-members = ["crates/fakeman-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
fakeman-core = { path = "crates/fakeman-core" }
fakeman-store = { path = "crates/fakeman-store" }
# GPUI comes in through gpui-kit, which pins the matching gpui-pre snapshot.
# Bump this rev deliberately; never add a separate GPUI dependency.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "38a54f0220024f7394dd07d7e6685688168d64e6" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

# Optimize the framework crates in dev builds so `cargo run` stays responsive,
# as recommended by gpui-kit. App code itself stays unoptimized.
[profile.dev]
debug = "limited"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
