[package]
name = "fakeman-store"
description = "SQLite persistence for fakeman."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
directories = "6"
# rusqlite_migration 2.7 is built against rusqlite 0.41; both must share one libsqlite3-sys.
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
