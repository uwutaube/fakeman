[package]
name = "fakeman-core"
description = "Domain model, generator catalog, body builder and runner for fakeman."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fake = "5.1"
form_urlencoded = "1"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
tokio-util = "0.7"
uuid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
wiremock = "0.6"

[lints]
workspace = true
