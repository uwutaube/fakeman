name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      macos:
        description: Also run the macOS job
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    uses: ./.github/workflows/check.yml
    with:
      os: windows-latest

  # macOS is opt-in; see "Enabling macOS" in README.md.
  macos:
    if: >-
      vars.ENABLE_MACOS == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.macos) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'macos'))
    uses: ./.github/workflows/check.yml
    with:
      os: macos-latest
